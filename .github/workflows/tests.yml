name: Core tests
on:
  push:
    branches: [main, rsm-localhost-rebuild]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate frontend JavaScript syntax
        run: node --check discord_wiki/web/app.js
      - name: Test without third-party runtime dependencies
        run: python -m unittest discover -s tests -v

  corpus-quality-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Recover original public Discord exports without vendoring them
        run: |
          git fetch --depth=1 origin archive/pre-rsm-reboot-2026-10-26
          mkdir -p .corpus-report/sources
          for stem in minecraft_redstone vrhardwaredev rpishowcase; do
            git show FETCH_HEAD:website-refactored/public/demo/files/$stem.json > .corpus-report/sources/$stem.json
          done
      - name: Run the real index against all three Discord exports
        run: |
          for stem in minecraft_redstone vrhardwaredev rpishowcase; do
            python tools/audit_export.py .corpus-report/sources/$stem.json --top 35 > .corpus-report/$stem.index.json
            echo "## $stem"
            python -c 'import json,sys; d=json.load(open(sys.argv[1])); print("Messages:",d["messages"]); print("Top subjects:",[x["term"] for x in d["top_terms"][:25]])' ".corpus-report/$stem.index.json"
          done
      - name: Inspect natural investigation questions against real messages
        run: |
          python - <<'PY'
          from discord_wiki.core import Library
          from pathlib import Path
          cases = {
              "minecraft_redstone": [
                  "Why does the daylight detector activate in daytime when the block is above it?",
                  "How is the compact 7-segment binary display constructed?",
                  "Why is the sugarcane farm not growing up to its observers?",
              ],
              "vrhardwaredev": [
                  "How can Lighthouse pose and finger rotations combine in a SteamVR driver?",
                  "How much does DIY eye tracking hardware cost?",
                  "What causes IMU drift for homemade VR trackers?",
              ],
              "rpishowcase": [
                  "How does Home Assistant automate the computer museum's Amazon Dash button tour?",
                  "Who built an MQTT Ambilight project using a Raspberry Pi?",
                  "What did the PyPoker author build and design?",
              ],
          }
          for stem, questions in cases.items():
              lib = Library(":memory:")
              did = lib.import_bytes(Path(".corpus-report/sources",stem+".json").read_bytes(),stem+".json")["id"]
              print("## QUESTION AUDIT",stem)
              for question in questions:
                  hits = lib.search(did,question,6)
                  print("QUESTION:",question)
                  for i, msg in enumerate(hits[:6],1):
                      print(i,msg["id"],repr(msg["content"][:150]))
              lib.close()
          PY
      - name: Prepare review artifacts
        run: |
          mkdir -p quality-report
          cp .corpus-report/*.index.json quality-report/
      - uses: actions/upload-artifact@v4
        with:
          name: real-discord-index-review
          path: quality-report/*.index.json
