name: Core tests
on:
  push:
    branches: [main, rsm-localhost-rebuild]
  pull_request:
jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test without third-party runtime dependencies
        run: python -m unittest discover -s tests -v
